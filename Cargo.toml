[package]
name = "rustyKraken"
version = "0.19.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rumqttc = "0.25"
reqwest = { version = "0.13", features = ["json", "stream"] }
axum = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1-rustls-tls", "smtp-transport"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mailparse = "0.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
futures-util = "0.3"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
walkdir = "2.5"
notify = "8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
regex = "1.11"
base64 = "0.22"
http = "1.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
feed-parser = "2.0"
parking_lot = "0.12"
serial2-tokio = "0.1"
snmp2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
urlencoding = "2.1"
time = { version = "0.3", features = ["formatting"] }
hostname = "0.4"
