# Beispiel: HTTP Webhook Tentacle
# Empfängt Nachrichten über HTTP POST und speichert sie im Event Bus

name: "webhook_example"
type: "http"
config:
  host: "127.0.0.1"
  port: 8080
  path: "/webhook"

# Test mit:
# curl -X POST http://127.0.0.1:8080/webhook \
#   -H "Content-Type: application/json" \
#   -d '{"topic": "/kraken/warning", "body": "Temperatur zu hoch: 42°C"}'
