name: "ntfy_kraken"
type: "ntfy"
config:
  # ntfy-Server-URL (self-hosted oder ntfy.sh)
  server: "https://ntfy.sh"
  
  # Topics, auf die abonniert werden soll
  topics:
    - "kraken/alerts"
    - "kraken/status"
  
  # Authentifizierung (optional, für geschützte Topics)
  # username: "user"
  # password: "${NTFY_PASSWORD}"
  # token: "${NTFY_TOKEN}"
  
  # Verbindungsart: "json" (JSON Stream, Standard) oder "websocket"
  connection_type: "json"
  
  # Optional: Mapping von ntfy-Topics auf rustyKraken-Topics
  topic_mapping:
    "kraken/alerts": "/kraken/alerts"
    "kraken/status": "/kraken/status"
  
  # Reconnection-Einstellungen
  reconnect_delay: 5
  max_reconnect_attempts: 0  # 0 = unendlich
