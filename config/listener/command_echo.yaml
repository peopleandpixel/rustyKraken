# Beispiel: Command Reflex
# Führt einen Shell-Befehl aus, wenn eine Nachricht auf ein Topic eingeht

name: "echo_warning"
trigger:
  topics:
    - "/octopus/**"
action:
  type: "command"
  config:
    command: "echo"
    args: ["Nachricht erhalten auf Topic:"]

# Umgebungsvariablen stehen zur Verfügung:
# INK_JSON - Die gesamte Nachricht als JSON
# INK_TOPIC - Das Topic der Nachricht
# INK_BODY - Der Inhalt der Nachricht
# INK_ID - Die UUID der Nachricht
